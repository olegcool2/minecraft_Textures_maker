name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests beautifulsoup4 pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "MCTextureReplacer" `
            --collect-all PIL `
            --collect-all bs4 `
            --collect-all requests `
            --collect-all charset_normalizer `
            --collect-all certifi `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCTextureReplacer-Windows
          path: dist/MCTextureReplacer.exe
          retention-days: 30
